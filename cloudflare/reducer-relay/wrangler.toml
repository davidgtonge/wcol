name = "wcol-reducer-relay"
main = "worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["durable_object_io_tasks_prevent_eviction"]

[limits]
cpu_ms = 120000

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[durable_objects.bindings]]
name = "RELAY_SCAN"
class_name = "RelayScan"

[[durable_objects.bindings]]
name = "RELAY_REDUCE"
class_name = "RelayReduce"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayScan", "RelayReduce"]
