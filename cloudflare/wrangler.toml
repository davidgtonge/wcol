name = "wcol-coordinator"
main = "dist/coordinator-worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["durable_object_io_tasks_prevent_eviction"]

[limits]
cpu_ms = 120000

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[[rules]]
type = "CompiledWasm"
globs = ["wcol_coordinator.wasm"]
fallthrough = true

[[durable_objects.bindings]]
name = "WCOL_COORDINATOR"
class_name = "WcolCoordinator"

[[durable_objects.bindings]]
name = "WCOL_NODE"
class_name = "WcolNode"
script_name = "wcol-node"

[[durable_objects.bindings]]
name = "WCOL_REDUCER_CONTAINER"
class_name = "WcolReducer"
script_name = "wcol-node"

[[r2_buckets]]
binding = "OUTPUT"
bucket_name = "wcol-hits-exports"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WcolCoordinator"]

# Every job attempt runs on fresh `graph:{job}:a{attempt}:s{slot}` objects. A fixed pool of
# reused names was tried and removed: Cloudflare kept reused objects in the isolates they
# already lived in, so each run packed the same work into fewer isolates (249, 235, 215
# over three ladder runs) and more of it failed as "overloaded" or out of memory.
[vars]
# New coordinators and nodes are created in the data bucket's region (wcol-hits-exports: EEUR).
WCOL_DO_LOCATION_HINT = "eeur"
# Scans per job. A job opens scans x reducers RPC streams, each with runtime buffers the
# isolate counts but we cannot see: 64 scans x 128 reducers (8192 streams) ran reducers
# out of memory and queued their accepts too long; 32 x 128 is the measured ceiling.
WCOL_MAX_NODES = "32"
WCOL_MAX_ACTIVE_SCANS = "32"
WCOL_MAX_ACTIVE_INGRESS = "32"
# Scan and reducer RPCs opened at once. Accepts are held open until consumed, so reducers
# stay live under full fan-in either way; 32 is what the deployed ladder runs used.
WCOL_DISPATCH_CONCURRENCY = "32"
# High-cardinality spill can go minutes between task progress records.
WCOL_STALL_MS = "300000"
# Explicit `hashReducers` above this are refused. Container reducers count against
# `max_instances` in wrangler.node.toml, so keep the two in step.
WCOL_MAX_REDUCERS = "128"
# Largest container instance a job may ask for (`reducerInstance`); `standard-4` only if set.
WCOL_MAX_CONTAINER_INSTANCE = "standard-3"
# Hostnames a job's `{ "url": ... }` sources may name, comma-separated. Unset or empty:
# URL sources are refused, so a job cannot make the coordinator fetch arbitrary hosts.
WCOL_URL_SOURCE_HOSTS = ""
