[package]
name = "df-planner"
version = "0.1.0"
edition = "2021"
description = "DataFusion SQL → logical plan only (no wcol, no execution)"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
datafusion-sql = { version = "55.2.0", default-features = false }
datafusion-expr = { version = "55.2.0", default-features = false, features = ["sql"] }
datafusion-common = { version = "55.2.0", default-features = false, features = ["sql"] }
datafusion-optimizer = { version = "55.2.0", default-features = false }
