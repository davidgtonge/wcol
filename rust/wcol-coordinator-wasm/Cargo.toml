[package]
name = "wcol-coordinator-wasm"
version = "0.1.0"
edition = "2021"
description = "Coordinator Worker cdylib: planning, streaming reduce, coordinator fragments."
license = "MIT"
publish = false

[lib]
name = "wcol_coordinator"
crate-type = ["cdylib"]

[dependencies]
wcol-engine = { path = "../wcol-engine", features = ["reduce-ffi", "coordinator-iterative-ffi"] }
wcol-plan = { path = "../wcol-plan" }
