[package]
name = "wcol-coordinator-wasm"
version = "0.1.0"
edition = "2021"
description = "Coordinator Worker cdylib: planning, streaming reduce, coordinator fragments."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "wcol_coordinator"
crate-type = ["cdylib"]

[features]
default = []
datafusion = ["wcol-plan/datafusion", "dep:uuid", "dep:getrandom"]

[dependencies]
wcol-engine = { path = "../wcol-engine", features = ["reduce-ffi", "coordinator-iterative-ffi"] }
wcol-plan = { path = "../wcol-plan" }
uuid = { version = "1", optional = true, features = ["js"] }
getrandom = { version = "0.3", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }
