[package]
name = "wcol-plan"
version = "0.1.0"
edition = "2021"
description = "WCOL coordinator planner (SQL parser, logical and physical planning)"
license = "MIT OR Apache-2.0"

[dependencies]
wcol-engine = { path = "../wcol-engine" }
# Field-level thrift for rewriting a source footer in a row-group split.
compact-parquet-thrift = "0.3.0"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde_json = "1"

[features]
default = []
native = []
