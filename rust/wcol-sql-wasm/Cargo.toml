[package]
name = "wcol-sql-wasm"
version = "0.1.0"
edition = "2021"
description = "DataFusion SQL planner Wasm (spike size / Cloudflare worker)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# This package is the DataFusion planner Wasm. Pass `--features datafusion`.
datafusion = ["wcol-sql/datafusion", "wcol/datafusion", "dep:uuid", "dep:getrandom", "dep:chrono"]

[dependencies]
wcol-sql = { path = "../wcol-sql", features = ["native"] }
wcol = { path = "../wcol" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DataFusion / Arrow pull `uuid` without a wasm RNG source unless we enable it.
uuid = { version = "1", features = ["js"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
console_error_panic_hook = "0.1"
# DataFusion OptimizerContext::new() calls chrono::Utc::now(); wasmbind uses JS Date in V8.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "wasmbind"], optional = true }
