[package]
name = "wcol-sql"
version = "0.1.0"
edition = "2021"
description = "Experimental DataFusion SQL frontend for wcol (spike)"
license = "MIT OR Apache-2.0"
autobins = false
autotests = false

[lib]
crate-type = ["rlib"]

[dependencies]
thiserror = "2"
# Direct DataFusion use in this crate. Enabled only by the `datafusion` feature.
datafusion-sql = { version = "55.2.0", optional = true }
datafusion-expr = { version = "55.2.0", optional = true }
datafusion-common = { version = "55.2.0", optional = true }
datafusion-optimizer = { version = "55.2.0", optional = true }
datafusion-functions = { version = "55.2.0", optional = true }
datafusion-functions-aggregate = { version = "55.2.0", optional = true }

[dependencies.wcol]
path = "../wcol"

[features]
default = []
native = ["wcol/native"]
# Same opt-in as `wcol`'s `datafusion` feature. Tests and bins require it.
datafusion = [
  "wcol/datafusion",
  "dep:datafusion-sql",
  "dep:datafusion-expr",
  "dep:datafusion-common",
  "dep:datafusion-optimizer",
  "dep:datafusion-functions",
  "dep:datafusion-functions-aggregate",
]

[[bin]]
name = "wcol-sql-plan"
path = "src/bin/wcol_sql_plan.rs"
required-features = ["native", "datafusion"]

[[bin]]
name = "dump-clickbench-plans"
path = "src/bin/dump_clickbench_plans.rs"
required-features = ["native", "datafusion"]

[dev-dependencies]
wcol = { path = "../wcol", features = ["native"] }

[[test]]
name = "clickbench_plans_snapshot"
path = "tests/clickbench_plans_snapshot.rs"
required-features = ["native", "datafusion"]

[[test]]
name = "datafusion_e2e"
path = "tests/datafusion_e2e.rs"
required-features = ["native", "datafusion"]

[[test]]
name = "frontend_parity"
path = "tests/frontend_parity.rs"
required-features = ["native", "datafusion"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["native", "datafusion"]

[[test]]
name = "job_output"
path = "tests/job_output.rs"
required-features = ["native", "datafusion"]

[[test]]
name = "wcol_logical"
path = "tests/wcol_logical.rs"
required-features = ["native", "datafusion"]
