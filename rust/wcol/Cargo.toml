[package]
name = "wcol"
version = "0.1.0"
edition = "2021"
description = "Facade over wcol-engine and wcol-plan"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
wcol-engine = { path = "../wcol-engine", features = ["coordinator-iterative-ffi"] }
wcol-plan = { path = "../wcol-plan" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
compact-parquet-thrift = "0.3.0"

[features]
default = []
alloc-track-native = ["wcol-engine/alloc-track-native"]
memory-plateau = ["alloc-track-native", "wcol-engine/memory-plateau"]
native = []

